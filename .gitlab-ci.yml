# GitLab CI — builds an unsigned test APK on every push to the repository.
#
# The build pipeline mirrors the F-Droid release recipe (see metadata.yml and
# BUILD-APK.md):
#   npm run build  ->  node scripts/clean-dist-data.js  ->  npx cap sync android
#   ->  ./gradlew assembleFossRelease
#
# The `foss` flavor is the F-Droid variant (fdroid.gradle excludes all GMS).
# The gradle preBuild tasks (moveMushafImages, buildWidgetHadiths,
# stripCompressedAssets) run automatically and handle the mushaf webp dedup,
# exactly like the F-Droid build.
#
# android/app/build.gradle has NO signingConfig, so Gradle emits an UNSIGNED
# APK. It installs fine via `adb install` for testing ("is the app ready?")
# but is NOT Play-Store distributable.

stages:
  - build

variables:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$ANDROID_SDK_ROOT"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

# Share npm modules + gradle caches across pipelines (keyed on lockfiles).
cache:
  key:
    files:
      - package-lock.json
      - android/gradle/wrapper/gradle-wrapper.properties
  paths:
    - node_modules/
    - .gradle-home/

build-apk:
  stage: build
  image: node:22-bookworm
  script:
    # --- Java 17 (required by AGP 8.9 / Gradle 8.11) ---
    - 'apt-get update -qq'
    - 'apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless unzip'
    - 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64'
    - 'export PATH="$JAVA_HOME/bin:$PATH"'
    # --- Android SDK command-line tools ---
    - 'mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"'
    - 'curl -fsSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
    - 'unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"'
    - 'mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"'
    - 'yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true'
    - '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS" "platform-tools"'
    # --- Web build + APK size cleanup + Capacitor sync (F-Droid order) ---
    - 'npm ci'
    - 'npm run build'
    - 'node scripts/clean-dist-data.js'
    - 'npx cap sync android'
    # --- Gradle: F-Droid (foss) release variant, unsigned ---
    - 'chmod +x android/gradlew'
    - 'cd android'
    - './gradlew assembleFossRelease --no-daemon'
    - 'cd ..'
  artifacts:
    name: "noor-connect-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - android/app/build/outputs/apk/fossRelease/*.apk
    expire_in: 14 days
    when: on_success
