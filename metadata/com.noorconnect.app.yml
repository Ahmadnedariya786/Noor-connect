RepoType: git

AutoName: Noor Connect
Icon: fastlane/metadata/android/en-US/images/icon.png
AntiFeatures:
  NonFreeNet:
    en-US: App connects to external Islamic APIs (prayer times, Quran data) hosted on third-party servers. Full API list documented at API_MANIFEST.md.

Builds:
  - versionName: 2.0.0
    versionCode: 5
    commit: 1af17fdf91d4143ee6b56977811f1f796d0f5137
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - foss
    prebuild:
      - cd ../../..
      - sed -i '/@capacitor\/background-runner/d' package.json
      - npm install
      - npm run build
      - node scripts/clean-dist-data.js
      - cd android && npx cap sync android && cd ..

MaintainerNotes: >
  Uses Capacitor. background-runner is removed to avoid prebuilt .so files.
  The foss flavor disables play-services dependency.
  Build requires Node.js 18+ and npm.
  clean-dist-data.js removes ~358MB of bundled data (mushaf pages, tafsir
  and hadith JSON) from dist/ before cap sync — these all have CDN/network
  fallbacks so the app still works fully online.

AutoUpdateMode: Version
UpdateCheckMode: Tags
