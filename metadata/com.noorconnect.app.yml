Builds:
  - versionName: 2.0.1
    versionCode: 6
    commit: 162a505d6283e8731c6b9535ea8810e54be9996b
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y golang-go make npm
    gradle:
      - foss
    srclibs:
      - esbuild@v0.21.5
    prebuild:
      - cd ../..
      - npm ci
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules
    build:
      - pushd $$esbuild$$
      - make esbuild
      - popd
      - cd ../..
      - cp $$esbuild$$/esbuild node_modules/@esbuild/linux-x64/bin/
      - cp $$esbuild$$/esbuild node_modules/esbuild/bin/
      - npm run build
      - npx cap sync android

MaintainerNotes: >
  Uses Capacitor with foss flavor (no play-services). esbuild is built from source
  via srclibs to satisfy F-Droid scanner. clean-dist-data.js removes ~358MB of
  bundled data (mushaf pages, tafsir and hadith JSON) from dist/ before cap sync
  — these all have CDN/network fallbacks so the app still works fully online.

