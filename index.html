  <!-- Pre-React Synchronous Theme Initializer: Reads saved theme before any CSS, link or paint -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('noor-theme') || localStorage.getItem('noor_theme') || localStorage.getItem('theme') || 'oxford-gold';
        var valid = ['oxford-gold', 'kiswah-noir', 'istanbul-sapphire', 'imperial-violet', 'burgundy-velvet', 'desert-scroll', 'madinah-emerald'];
        if (valid.indexOf(savedTheme) === -1) savedTheme = 'oxford-gold';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.className = 'dark ' + savedTheme + ' splash-active';

        // Check user startup splash preference
        var splashEnabled = localStorage.getItem('splash_enabled');
        if (splashEnabled === 'false') {
          document.documentElement.classList.remove('splash-active');
          var style = document.createElement('style');
          style.id = 'splash-off-style';
          style.textContent = '#initial-splash, #static-splash { display: none !important; }';
          document.head.appendChild(style);
        }

        // Check user startup greeting subtitle preference
        var splashGreeting = localStorage.getItem('splash_greeting_enabled');
        if (splashGreeting === 'false') {
          var greetStyle = document.createElement('style');
          greetStyle.id = 'splash-greeting-off-style';
          greetStyle.textContent = '#splash-subtitle { display: none !important; }';
          document.head.appendChild(greetStyle);
        }

        // Allow tap-to-dismiss on initial splash immediately
        function dismissInitialSplash() {
          try {
            document.documentElement.classList.remove('splash-active');
            document.body.classList.remove('splash-active');
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
            document.documentElement.style.touchAction = '';
            document.body.style.touchAction = '';
            var el = document.getElementById('initial-splash');
            if (el) el.remove();
            var s = document.getElementById('static-splash');
            if (s) s.remove();
          } catch (e) {}
        }

        // Native unconditional failsafe timer: forces removal of splash screen and releases scroll lock
        // after 1800ms under all conditions, even if React or any external script throws or hangs.
        setTimeout(dismissInitialSplash, 1800);

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            var el = document.getElementById('initial-splash');
            if (el) el.addEventListener('click', dismissInitialSplash);
          });
        } else {
          var el = document.getElementById('initial-splash');
          if (el) el.addEventListener('click', dismissInitialSplash);
        }
      } catch (e) {
        // Safe fallback
      }
    })();
  </script>

<body class="splash-active">
  <!-- Static pre-React splash element: clean minimal dark background (#090D16) removed immediately upon React render to eliminate mid-splash double-logo jump -->
  <div id="initial-splash" class="static-splash" aria-hidden="true" style="position:fixed;inset:0;width:100vw;height:100dvh;background:#090D16;z-index:2147483647;pointer-events:all;"></div>
  <div id="root"></div>

  <!-- Permanent HTML-Level Boot Watchdog: Prevents black screen freezes if JS mount throws or halts -->
  <script>
    (function () {
      var bootError = null;
      window.addEventListener('error', function (e) {
        if (!bootError) {
          bootError = (e && e.message) ? e.message : 'Script execution error';
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (!bootError) {
          bootError = (e && e.reason && (e.reason.message || e.reason)) ? String(e.reason.message || e.reason) : 'Unhandled promise rejection';
        }
      });

      setTimeout(function () {
        var root = document.getElementById('root');
        var splash = document.getElementById('initial-splash');
        var isRootEmpty = !root || root.childElementCount === 0 || root.innerHTML.trim() === '';

        if (isRootEmpty) {
          if (splash) {
            try { splash.remove(); } catch (e) {}
          }
          document.documentElement.classList.remove('splash-active');
          document.body.classList.remove('splash-active');
          document.documentElement.style.overflow = 'auto';
          document.body.style.overflow = 'auto';
          document.documentElement.style.touchAction = 'auto';
          document.body.style.touchAction = 'auto';

          if (root) {
            root.style.minHeight = '100vh';
            root.style.width = '100vw';
            root.style.display = 'flex';
            root.style.flexDirection = 'column';
            root.style.alignItems = 'center';
            root.style.justifyContent = 'center';
            root.style.backgroundColor = '#050914';
            root.style.color = '#F8FAFC';
            root.style.padding = '24px 16px';
            root.style.boxSizing = 'border-box';
            root.style.fontFamily = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

            var errHtml = bootError
              ? '<div style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px;margin:16px 0;text-align:left;max-height:100px;overflow-y:auto;font-family:monospace;font-size:11px;color:#FCA5A5;word-break:break-word;">' + bootError + '</div>'
              : '';

            root.innerHTML = [
              '<div style="max-width:400px;width:100%;text-align:center;background:#0E1424;padding:28px 20px;border-radius:24px;border:1px solid rgba(226,232,240,0.16);box-shadow:0 16px 40px rgba(0,0,0,0.7);box-sizing:border-box;">',
                '<div style="width:54px;height:54px;border-radius:50%;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#F87171;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;">🌙</div>',
                '<h2 style="font-size:19px;font-weight:800;margin:0 0 8px;color:#F8FAFC;">Noor Connect Recovery</h2>',
                '<p style="font-size:13px;color:#94A3B8;margin:0 0 16px;line-height:1.5;">The app is taking longer than usual to start or encountered a boot hitch. Your Qur\'an and Qaza data are safe.</p>',
                errHtml,
                '<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">',
                  '<button id="boot-watchdog-reload" style="width:100%;padding:13px;border-radius:14px;border:none;background:#C8B89A;color:#050914;font-weight:800;font-size:14px;cursor:pointer;">🔄 Reload App</button>',
                  '<button id="boot-watchdog-reset" style="width:100%;padding:13px;border-radius:14px;border:1px solid rgba(226,232,240,0.22);background:rgba(255,255,255,0.04);color:#E2E8F0;font-weight:700;font-size:14px;cursor:pointer;">🧹 Reset Cache & Reload</button>',
                '</div>',
              '</div>'
            ].join('');

            var reloadBtn = document.getElementById('boot-watchdog-reload');
            if (reloadBtn) {
              reloadBtn.onclick = function () { window.location.reload(); };
            }

            var resetBtn = document.getElementById('boot-watchdog-reset');
            if (resetBtn) {
              resetBtn.onclick = function () {
                try {
                  var preserve = ['qaza', 'quran', 'theme', 'user_location', 'location', 'tasbeeh', 'hadith', 'owner', 'mushaf'];
                  if (typeof localStorage !== 'undefined') {
                    var toDelete = [];
                    for (var i = 0; i < localStorage.length; i++) {
                      var key = localStorage.key(i);
                      if (key) {
                        var keep = false;
                        var lk = key.toLowerCase();
                        for (var p = 0; p < preserve.length; p++) {
                          if (lk.indexOf(preserve[p]) !== -1) { keep = true; break; }
                        }
                        if (!keep) toDelete.push(key);
                      }
                    }
                    for (var d = 0; d < toDelete.length; d++) {
                      localStorage.removeItem(toDelete[d]);
                    }
                  }
                  if (typeof sessionStorage !== 'undefined') {
                    sessionStorage.clear();
                  }
                  if (window.caches) {
                    window.caches.keys().then(function (names) {
                      names.forEach(function (n) { window.caches.delete(n); });
                    });
                  }
                } catch (e) {}
                window.location.reload();
              };
            }
          }
        }
      }, 2500);
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
