<!doctype html>
<html lang="en" class="dark splash-active">

<head>
  <!-- Pre-React Synchronous Theme Initializer: Reads saved theme before any CSS, link or paint -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('noor-theme') || localStorage.getItem('noor_theme') || localStorage.getItem('theme') || 'oxford-gold';
        var valid = ['oxford-gold', 'madinah-emerald', 'imperial-violet', 'burgundy-velvet', 'desert-scroll'];
        if (valid.indexOf(savedTheme) === -1) savedTheme = 'oxford-gold';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.className = 'dark ' + savedTheme + ' splash-active';

        // Check user startup splash preference
        var splashEnabled = localStorage.getItem('splash_enabled');
        if (splashEnabled === 'false') {
          document.documentElement.classList.remove('splash-active');
          var style = document.createElement('style');
          style.id = 'splash-off-style';
          style.textContent = '#initial-splash, #static-splash { display: none !important; }';
          document.head.appendChild(style);
        }

        // Check user startup greeting subtitle preference
        var splashGreeting = localStorage.getItem('splash_greeting_enabled');
        if (splashGreeting === 'false') {
          var greetStyle = document.createElement('style');
          greetStyle.id = 'splash-greeting-off-style';
          greetStyle.textContent = '#splash-subtitle { display: none !important; }';
          document.head.appendChild(greetStyle);
        }
      } catch (e) {
        // Safe fallback
      }
    })();
  </script>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      min-height: 100%;

      color: var(--text-primary);
      font-family: 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', sans-serif;
    }

    /* Scroll locked ONLY while splash is visible */
    html.splash-active,
    body.splash-active {
      height: 100% !important;
      overflow: hidden !important;
      touch-action: none !important;
      overscroll-behavior: none !important;
    }

    #root {
      min-height: 100vh;
      width: 100%;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      display: block;
    }

    #initial-splash,
    #static-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-base);
      background-image: radial-gradient(circle at 50% 38%, var(--accent-soft) 0%, var(--bg-elev) 45%, var(--bg-base) 100%);
      color: var(--text-primary);
      overflow: hidden;
      z-index: 2147483647;
      pointer-events: all;
    }

    @keyframes pulseStar {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.9);
      }
      50% {
        opacity: 0.65;
        transform: scale(1.15);
      }
    }

    @keyframes pulseHalo {
      0%, 100% {
        opacity: 0.35;
        transform: scale(1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.08);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinSlow {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes shimmerComet {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    @keyframes shimmerGlass {
      0% {
        transform: translateX(-150%) skewX(-20deg);
      }
      100% {
        transform: translateX(200%) skewX(-20deg);
      }
    }
