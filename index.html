<!doctype html>
<html lang="en" class="dark" data-theme="oxford-gold">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- PWA Manifest and Icons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="preload" as="image" href="/icon-192x192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json?v=1" />

  <!-- Apple Touch Icons for native app experience -->
  <link rel="apple-touch-icon" sizes="72x72" href="/icon-72x72.png" />
  <link rel="apple-touch-icon" sizes="96x96" href="/icon-96x96.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="/icon-128x128.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="/icon-144x144.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="384x384" href="/icon-384x384.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png" />

  <!-- Apple Safari and PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Noor Connect" />
  <meta name="application-name" content="Noor Connect" />
  <meta name="msapplication-TileColor" content="#150D2E" />
  <meta name="theme-color" content="#150D2E" />
  <!-- Content Security Policy: Self-contained for F-Droid with Google Fonts for Arabic Typography -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; script-src-attr 'none'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob: http://localhost; connect-src 'self' https: wss: http: blob:; media-src 'self' https: blob: http:; frame-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <title>Noor Connect - Your Islamic Companion</title>
  <meta name="description"
    content="Noor Connect - Prayer times, Qur'an, Qibla, Tasbeeh, and Daily Hadith. Your complete Islamic companion app.">
  <meta name="author" content="Noor Connect" />

  <!-- Preconnect and Load Google Fonts: Amiri for Authentic Arabic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <link rel="dns-prefetch" href="https://api.aladhan.com">

  <!-- Font Stacks -->
  <style>
    :root {
      --font-noor-main: 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', sans-serif;
      --font-arabic-amiri: 'Amiri', 'Traditional Arabic', 'Scheherazade New', 'ui-serif', Georgia, serif;
    }
  </style>

  <!-- Open Graph / Twitter meta tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Noor Connect - Your Islamic Companion">
  <meta property="og:description"
    content="Noor Connect - Prayer times, Qur'an, Qibla, Tasbeeh, and Daily Hadith. Your complete Islamic companion app.">
   <meta property="og:image"
      content="/qibla.png">
   <meta name="twitter:image"
      content="/qibla.png">

  <!-- Splash Screen CSS is handled inline by the React SplashScreen component -->

  <!-- Inline critical CSS for seamless first paint -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      min-height: 100%;
      background: #0E0B1E;
      color: #ffffff;
      font-family: 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', sans-serif;
    }

    /* Scroll locked ONLY while splash is visible */
    html.splash-active,
    body.splash-active {
      height: 100% !important;
      overflow: hidden !important;
      touch-action: none !important;
      overscroll-behavior: none !important;
    }

    #root {
      min-height: 100vh;
      width: 100%;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      display: block;
    }

    #static-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #24164c 0%, #150D2E 60%, #0a0618 100%);
      color: #fff;
      overflow: hidden;
      z-index: 100;
      pointer-events: none;
    }

    @keyframes pulseHalo {
      0%, 100% {
        opacity: 0.35;
        transform: scale(1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.08);
      }
    }

    @keyframes spinSlow {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes shimmerComet {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    @keyframes shimmerGlass {
      0% {
        transform: translateX(-150%) skewX(-20deg);
      }
      100% {
        transform: translateX(200%) skewX(-20deg);
      }
    }
  </style>
</head>

<body class="splash-active">
  <!-- Static pre-React splash element: physically removed by React once SplashScreen mounts with 0 layout jump -->
  <div id="static-splash" aria-hidden="true">
    <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;">
      <!-- Celestial Rub el Hizb Medallion (Layer 1, 2, 3) -->
      <div style="position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;">
        <!-- Layer 1: Ambient Radial Halo -->
        <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle, rgba(245,185,66,0.28) 0%, transparent 70%);animation:pulseHalo 3s ease-in-out infinite;pointer-events:none;"></div>
        <!-- Layer 2: Slow-Rotating Geometric Filigree Ring -->
        <svg width="142" height="142" viewBox="0 0 100 100" style="position:absolute;pointer-events:none;animation:spinSlow 28s linear infinite;">
          <circle cx="50" cy="50" r="46" stroke="rgba(245, 195, 90, 0.45)" stroke-width="1.2" stroke-dasharray="3 3" fill="none" />
          <rect x="22" y="22" width="56" height="56" rx="6" stroke="rgba(245, 195, 90, 0.45)" stroke-width="1.2" fill="none" />
          <rect x="22" y="22" width="56" height="56" rx="6" transform="rotate(45 50 50)" stroke="rgba(245, 195, 90, 0.45)" stroke-width="1.2" fill="none" />
        </svg>
        <!-- Layer 3: Elevated Squircle Jewel Emblem -->
        <div style="position:relative;z-index:10;width:96px;height:96px;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#150D2E;border:1.5px solid rgba(245, 195, 90, 0.65);box-shadow:0 16px 36px rgba(0,0,0,0.65), inset 0 1px 1px rgba(255,255,255,0.4), inset 0 -1px 1px rgba(0,0,0,0.5);">
          <img src="/logo-mark.png" alt="Noor Connect Logo" style="width:84px;height:84px;object-fit:contain;position:relative;z-index:10;border-radius:18px;" />
          <div style="position:absolute;inset:0;pointer-events:none;z-index:20;background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);animation:shimmerGlass 2.4s ease-in-out infinite;"></div>
        </div>
      </div>

      <!-- Brand Title: NOOR CONNECT -->
      <h1 style="margin:20px 0 0 0;font-size:1.25rem;font-weight:800;letter-spacing:0.22em;background:linear-gradient(180deg, #FFF7E0 0%, #E5B85B 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;text-transform:uppercase;font-family:system-ui,-apple-system,sans-serif;">
        NOOR CONNECT
      </h1>

      <!-- Subtitle: ISLAMIC COMPANION -->
      <p style="margin:6px 0 0 0;font-size:0.72rem;font-weight:600;letter-spacing:0.30em;color:rgba(235, 205, 140, 0.82);text-align:center;text-transform:uppercase;font-family:system-ui,-apple-system,sans-serif;">
        ISLAMIC COMPANION
      </p>

      <!-- Sleek Gold Shimmer Loader Bar -->
      <div style="width:120px;height:3px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin-top:22px;position:relative;">
        <div style="position:absolute;inset:0;width:100%;height:100%;background:linear-gradient(90deg, transparent, #F5C35A, #FFF3D1, #F5C35A, transparent);animation:shimmerComet 1.6s ease-in-out infinite;"></div>
      </div>
    </div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:128px;pointer-events:none;background:linear-gradient(to top, rgba(245, 197, 66, 0.08), transparent);"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
