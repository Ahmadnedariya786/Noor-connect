<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- PWA Manifest and Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preload" as="image" href="/icon-192x192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json?v=1" />

  <!-- Apple Touch Icons for native app experience -->
  <link rel="apple-touch-icon" sizes="72x72" href="/icon-72x72.png" />
  <link rel="apple-touch-icon" sizes="96x96" href="/icon-96x96.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="/icon-128x128.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="/icon-144x144.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="384x384" href="/icon-384x384.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png" />

  <!-- Apple Safari and PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Noor Connect" />
  <meta name="application-name" content="Noor Connect" />
  <meta name="msapplication-TileColor" content="#0E0B1E" />
  <meta name="theme-color" content="#0E0B1E" />
  <!-- Content Security Policy: Self-contained for F-Droid -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; script-src-attr 'none'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: blob: http://localhost; connect-src 'self' https: wss: http: blob:; media-src 'self' https: blob: http:; frame-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <title>Noor Connect - Your Islamic Companion</title>
  <meta name="description"
    content="Noor Connect - Prayer times, Qur'an, Qibla, Tasbeeh, and Daily Hadith. Your complete Islamic companion app.">
  <meta name="author" content="Noor Connect" />

  <!-- Localized SEO and performance - No external CDNs for F-Droid compliance -->
  <link rel="dns-prefetch" href="https://api.aladhan.com">

  <!-- System Font Stack - No external font dependencies -->
  <style>
    /* Using CSS custom property for system font stack - no web font downloads */
    :root {
      --font-noor-main: 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', sans-serif;
    }
  </style>

  <!-- Open Graph / Twitter meta tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Noor Connect - Your Islamic Companion">
  <meta property="og:description"
    content="Noor Connect - Prayer times, Qur'an, Qibla, Tasbeeh, and Daily Hadith. Your complete Islamic companion app.">
   <meta property="og:image"
      content="/qibla.png">
   <meta name="twitter:image"
      content="/qibla.png">

  <!-- Splash Screen CSS is handled inline by the React SplashScreen component -->

  <!-- Inline critical CSS for seamless first paint -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #0E0B1E;
      color: #ffffff;
      font-family: 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', sans-serif;
    }

    /* Scroll locked ONLY while splash is visible */
    html.splash-active,
    body.splash-active {
      height: 100% !important;
      overflow: hidden !important;
      touch-action: none !important;
      overscroll-behavior: none !important;
    }

    #root {
      min-height: 100vh;
      width: 100%;
      display: block;
    }

    #static-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #181335 0%, #0E0B1E 60%, #080612 100%);
      color: #fff;
      overflow: hidden;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>

<body class="splash-active">
  <!-- Static pre-React splash element: physically removed by React once SplashScreen mounts -->
  <div id="static-splash" aria-hidden="true">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;">
      <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;">
        <div style="position:absolute;inset:0;border-radius:24px;background:radial-gradient(circle, rgba(245,197,66,0.35) 0%, transparent 70%);filter:blur(24px);transform:scale(1.3);"></div>
        <img src="/logo-mark.svg" alt="Noor Connect Logo" style="width:96px;height:96px;object-fit:contain;position:relative;z-index:10;filter:drop-shadow(0 12px 32px rgba(245,197,66,0.28));" />
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:0.22em;text-transform:uppercase;background:linear-gradient(135deg, #FDE68A 0%, #F5C542 35%, #E8A317 70%, #D48F0E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:system-ui,-apple-system,sans-serif;">Noor Connect</h1>
        <p style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.32em;text-transform:uppercase;color:rgba(212,175,55,0.8);font-family:system-ui,-apple-system,sans-serif;">Islamic Companion</p>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <span style="width:8px;height:8px;border-radius:50%;background:#F5C542;box-shadow:0 0 10px rgba(245,197,66,0.6);"></span>
        <span style="width:8px;height:8px;border-radius:50%;background:#F5C542;box-shadow:0 0 10px rgba(245,197,66,0.6);"></span>
        <span style="width:8px;height:8px;border-radius:50%;background:#F5C542;box-shadow:0 0 10px rgba(245,197,66,0.6);"></span>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
