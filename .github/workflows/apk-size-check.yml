name: APK Size Check

on:
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch:

jobs:
  size-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Standard APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Check APK size
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "APK size: ${SIZE_MB}MB"
          echo "APK_SIZE_MB=${SIZE_MB}" >> $GITHUB_ENV

      - name: Comment size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const size = process.env.APK_SIZE_MB;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 APK size: **${size} MB**`
            });
