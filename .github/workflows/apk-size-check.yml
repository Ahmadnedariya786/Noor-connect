name: APK Size Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: apk-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-check:
    name: Verify Android APK Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Clean dist assets for Android
        run: node scripts/clean-dist-data.js || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK Size (<= 130 MB)
        id: size_check
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: No APK file found under android/app/build/outputs/apk!"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          SIZE_BYTES=$(wc -c < "$APK_PATH" | tr -d ' ')
          SIZE_MB=$(awk -v b="$SIZE_BYTES" 'BEGIN { printf "%.2f", b / (1024 * 1024) }')
          MAX_ALLOWED_MB=130
          MAX_ALLOWED_BYTES=$((MAX_ALLOWED_MB * 1024 * 1024))
          APK_NAME=$(basename "$APK_PATH")

          echo "APK_SIZE_BYTES=$SIZE_BYTES" >> $GITHUB_ENV
          echo "APK_SIZE_MB=$SIZE_MB" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "apk_size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "apk_file_name=$APK_NAME" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "📦 APK Name:     $APK_NAME"
          echo "📊 APK Size:     ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          echo "🎯 Threshold:    <= ${MAX_ALLOWED_MB} MB (${MAX_ALLOWED_BYTES} bytes)"
          echo "=========================================="

          STATUS="✅ PASS"
          if [ "$SIZE_BYTES" -gt "$MAX_ALLOWED_BYTES" ]; then
            STATUS="❌ EXCEEDED"
          fi

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 📦 Android APK Size Audit Report

          | Metric | Value | Threshold | Status |
          | :--- | :--- | :--- | :--- |
          | **Artifact** | \`$APK_NAME\` | - | - |
          | **APK Size** | **${SIZE_MB} MB** | **≤ ${MAX_ALLOWED_MB} MB** | $STATUS |
          | **Raw Bytes** | \`${SIZE_BYTES}\` bytes | \`${MAX_ALLOWED_BYTES}\` bytes | - |
          | **Engine** | Capacitor 6 + React 18 | Bundled Offline Mushaf & Fonts | ✅ Verified |
          EOF

          if [ "$SIZE_BYTES" -gt "$MAX_ALLOWED_BYTES" ]; then
            echo "❌ ERROR: APK size ${SIZE_MB} MB exceeds threshold of ${MAX_ALLOWED_MB} MB!"
            exit 1
          fi

          echo "✅ APK size is within the acceptable threshold (${SIZE_MB} MB <= ${MAX_ALLOWED_MB} MB)."

      - name: Comment size on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const size = process.env.APK_SIZE_MB;
            const name = process.env.APK_FILE_NAME;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 📦 APK Size Report\n\n- **Artifact:** \`${name}\`\n- **Size:** **${size} MB** (Threshold: ≤ 130 MB)\n- **Status:** ✅ **PASS (Within Limits)**`
            });
