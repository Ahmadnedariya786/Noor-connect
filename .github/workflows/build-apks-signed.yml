name: Build Signed APKs

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Decode keystore from secret
        run: |
          echo "Decoding keystore from GitHub secret..."
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/noorconnectjks
          chmod 600 android/keystore/noorconnectjks
          ls -la android/keystore/

      - name: Create local.properties for keystore
        run: |
          echo "Creating local.properties with keystore secrets..."
          cat > android/local.properties << EOF
sdk.dir=C:\\Users\\urooj\\AppData\\Local\\Android\\Sdk
RELEASE_STORE_FILE=android/keystore/noorconnectjks
RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
EOF

      - name: Build Standard Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          echo "✅ Standard APK build completed successfully"

      - name: Build F-Droid Release APK
        run: |
          cd android
          ./gradlew assembleRelease -Pfoss=true --no-daemon
          echo "✅ F-Droid APK build completed successfully"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noor-connect-apks
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/fossRelease/app-fossRelease.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Noor Connect ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload Standard APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: android/app/build/outputs/apk/release/app-release.apk
          asset_name: noor-connect-${{ github.ref_name }}-standard.apk
          asset_content_type: application/apk

      - name: Upload F-Droid APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: android/app/build/outputs/apk/fossRelease/app-fossRelease.apk
          asset_name: noor-connect-${{ github.ref_name }}-fdroid.apk
          asset_content_type: application/apk
