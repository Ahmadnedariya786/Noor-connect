name: Build Signed APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s\n' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/keystore/noorconnectjks
          chmod 600 android/keystore/noorconnectjks

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore android/keystore/noorconnectjks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Write local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${{ github.workspace }}/android/keystore/noorconnectjks"
          echo "RELEASE_STORE_FILE=${KEYSTORE_PATH}" > android/local.properties
          echo "RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> android/local.properties
          echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> android/local.properties
          echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> android/local.properties

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-connect-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
