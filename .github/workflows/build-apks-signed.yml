name: Build Signed APKs

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0

      - name: Decode keystore from secret
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/noorconnectjks
          chmod 600 android/keystore/noorconnectjks

      - name: Create local.properties
        run: |
          cat > android/local.properties << EOF
          RELEASE_STORE_FILE=android/keystore/noorconnectjks
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Standard Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build F-Droid Release APK
        run: |
          cd android
          ./gradlew assembleRelease -Pfoss=true --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noor-connect-apks
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/fossRelease/app-fossRelease.apk
          retention-days: 30
