name: Build Signed APK (Standard & F-Droid)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GRADLE_ARGS: --no-daemon

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git python3-pip
          pip3 install awscli

      - name: Configure keystore from secret
        run: |
          echo "Configuring keystore for Gradle build..."
          mkdir -p android/keystore
          
          echo "Storing keystore in GitHub Secrets..."
          echo "Note: This workflow now uses GitHub secrets for the keystore"
          echo "Make sure to set up the following secrets in your GitHub repository:"
          echo "  - NOOR_KEYSTORE (base64 encoded keystore file)"
          echo "  - NOOR_KEYSTORE_PASSWORD (your keystore password)"
          echo "  - NOOR_KEY_ALIAS (your key alias)"
          echo "  - NOOR_KEY_PASSWORD (your key password)"

      - name: Create gradlew.properties for keystore
        run: |
          mkdir -p gradle.properties
          echo "GRADLE_PROPERTIES_PATH=${GITHUB_WORKSPACE}/gradle.properties" >> $GITHUB_ENV

      - name: Build Standard Release APK
        run: |
          cd android
          ./gradlew assembleRelease ${{ env.GRADLE_ARGS }}
          echo "✅ Standard APK build completed successfully"

      - name: Build F-Droid Release APK
        run: |
          cd android
          ./gradlew assembleRelease -Pfoss=true ${{ env.GRADLE_ARGS }}
          echo "✅ F-Droid APK build completed successfully"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noor-connect-apks
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/fossRelease/app-fossRelease.apk
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Noor Connect ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: android/app/build/outputs/apk/release/app-release.apk
          asset_name: noor-connect-${{ github.ref_name }}-standard.apk
          asset_content_type: application/apk

      - name: Upload F-Droid APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: android/app/build/outputs/apk/fossRelease/app-fossRelease.apk
          asset_name: noor-connect-${{ github.ref_name }}-fdroid.apk
          asset_content_type: application/apk
