name: Nightly APK Factory

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-apk
  cancel-in-progress: true

jobs:
  build-nightly:
    name: Build & Publish Nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Clean dist assets for Android
        run: node scripts/clean-dist-data.js || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset & Metadata
        id: prep
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "timestamp=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

          # Locate generated debug APK (flavor is foss, buildType is debug)
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*debug.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: Could not find generated debug APK!"
            exit 1
          fi

          echo "Found debug APK at: $APK_FILE"
          cp "$APK_FILE" noor-connect-nightly.apk

          FILE_SIZE=$(ls -lh noor-connect-nightly.apk | awk '{print $5}')
          echo "size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "Prepared noor-connect-nightly.apk ($FILE_SIZE)"

      - name: Publish Nightly GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build"
          prerelease: true
          make_latest: false
          files: noor-connect-nightly.apk
          body: |
            ### 🌙 Noor Connect — Nightly Build
            
            Continuous automated build from the `main` branch.
            
            - **Commit SHA:** `${{ github.sha }}` (`${{ steps.prep.outputs.sha_short }}`)
            - **Branch:** `${{ github.ref_name }}`
            - **Build Timestamp (UTC):** `${{ steps.prep.outputs.timestamp }}`
            - **APK Size:** `${{ steps.prep.outputs.size }}`
            
            #### 📲 Download APK
            👉 **[Download noor-connect-nightly.apk](https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/noor-connect-nightly.apk)**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
