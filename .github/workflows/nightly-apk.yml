name: Nightly APK Factory

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-apk
  cancel-in-progress: true

jobs:
  build-nightly:
    name: Build & Publish Nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Clean dist assets for Android
        run: node scripts/clean-dist-data.js || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Validate Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$KEYSTORE_BASE64" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_BASE64"
          fi
          if [ -z "$KEYSTORE_STORE_PASS" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_STORE_PASS"
          fi
          if [ -z "$KEYSTORE_KEY_PASS" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_KEY_PASS"
          fi
          if [ -z "$KEYSTORE_ALIAS" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_ALIAS"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "❌ ERROR: Missing required GitHub repository secrets for release signing:"
            for s in $MISSING_SECRETS; do
              echo "   - $s"
            done
            echo ""
            echo "Please configure these secrets under Repository Settings -> Secrets and variables -> Actions."
            echo "Refer to RELEASE_SETUP.md for values and setup instructions."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "❌ Error: Decoded android/app/release.keystore is empty or invalid!"
            exit 1
          fi
          echo "✅ Keystore decoded successfully ($(wc -c < android/app/release.keystore) bytes)"

      - name: Build Android Release APK
        env:
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset & Metadata
        id: prep
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "timestamp=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

          # Create build-info.json asset
          cat <<EOF > build-info.json
          {
            "commit": "${{ github.sha }}",
            "sha_short": "$(echo ${{ github.sha }} | cut -c1-7)",
            "timestamp": "$BUILD_TIME",
            "version": "2.2.1"
          }
          EOF

          # Locate generated release APK (finds either app-release.apk or app-foss-release.apk)
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*release.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: Could not find generated release APK!"
            exit 1
          fi

          echo "Found release APK at: $APK_FILE"
          mkdir -p android/app/build/outputs/apk/release
          cp "$APK_FILE" android/app/build/outputs/apk/release/app-release.apk
          cp "$APK_FILE" noor-connect-nightly.apk

          FILE_SIZE=$(ls -lh noor-connect-nightly.apk | awk '{print $5}')
          echo "size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "Prepared noor-connect-nightly.apk ($FILE_SIZE)"

      - name: Publish Nightly GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build"
          prerelease: true
          make_latest: false
          files: |
            noor-connect-nightly.apk
            build-info.json
          body: |
            ### 🌙 Noor Connect — Nightly Build
            
            Continuous automated build from the `main` branch.
            
            commit: ${{ github.sha }}
            - **Commit SHA:** `${{ github.sha }}` (`${{ steps.prep.outputs.sha_short }}`)
            - **Branch:** `${{ github.ref_name }}`
            - **Build Timestamp (UTC):** `${{ steps.prep.outputs.timestamp }}`
            - **APK Size:** `${{ steps.prep.outputs.size }}`
            
            #### 📲 Download APK
            👉 **[Download noor-connect-nightly.apk](https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/noor-connect-nightly.apk)**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
