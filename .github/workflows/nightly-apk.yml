name: Nightly APK Factory

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-apk
  cancel-in-progress: true

jobs:
  build-nightly:
    name: Build & Publish Nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Clean dist assets for Android
        run: node scripts/clean-dist-data.js || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Validate Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$KEYSTORE_BASE64" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_BASE64"
          fi
          if [ -z "$KEYSTORE_STORE_PASS" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_STORE_PASS"
          fi
          if [ -z "$KEYSTORE_KEY_PASS" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_KEY_PASS"
          fi
          if [ -z "$KEYSTORE_ALIAS" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_ALIAS"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "❌ ERROR: Missing required GitHub repository secrets for release signing:"
            for s in $MISSING_SECRETS; do
              echo "   - $s"
            done
            echo ""
            echo "Please configure these secrets under Repository Settings -> Secrets and variables -> Actions."
            echo "Refer to RELEASE_SETUP.md for values and setup instructions."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "❌ Error: Decoded android/app/release.keystore is empty or invalid!"
            exit 1
          fi
          echo "✅ Keystore decoded successfully ($(wc -c < android/app/release.keystore) bytes)"

      - name: Build Android Release APK
        env:
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          MAX_ATTEMPTS=3
          ATTEMPT=1
          until ./gradlew assembleRelease --no-daemon; do
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "❌ Gradle assembleRelease failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi
            echo "⚠️ Gradle build failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Retrying in 10 seconds..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

      - name: Prepare APK Asset & Metadata
        id: prep
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "timestamp=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

          # Create build-info.json asset
          cat <<EOF > build-info.json
          {
            "commit": "${{ github.sha }}",
            "sha_short": "$(echo ${{ github.sha }} | cut -c1-7)",
            "timestamp": "$BUILD_TIME",
            "version": "2.2.1"
          }
          EOF

          # Create version.json manifest asset for unlimited rate-limit fallback
          cat <<EOF > version.json
          {
            "version": "2.2.1",
            "commit": "${{ github.sha }}",
            "shortCommit": "$(echo ${{ github.sha }} | cut -c1-7)",
            "builtAt": "$BUILD_TIME",
            "apkUrl": "https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/noor-connect-nightly.apk"
          }
          EOF

          # Locate generated release APK (finds either app-release.apk or app-foss-release.apk)
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*release.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: Could not find generated release APK!"
            exit 1
          fi

          echo "Found release APK at: $APK_FILE"
          mkdir -p android/app/build/outputs/apk/release
          cp "$APK_FILE" android/app/build/outputs/apk/release/app-release.apk
          cp "$APK_FILE" noor-connect-nightly.apk
          cp "$APK_FILE" NoorConnect-v2.2.1.apk

          sha256sum noor-connect-nightly.apk > noor-connect-nightly.apk.sha256
          sha256sum NoorConnect-v2.2.1.apk > NoorConnect-v2.2.1.apk.sha256

          FILE_SIZE=$(ls -lh noor-connect-nightly.apk | awk '{print $5}')
          echo "size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "Prepared noor-connect-nightly.apk and NoorConnect-v2.2.1.apk ($FILE_SIZE)"

      - name: Publish Official GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<'EOF' > release-notes.md
          ### 🌙 Noor Connect v2.2.1 — Official Latest Release

          **Noor Connect** is a privacy-first Islamic companion for Android & Web with 100% offline fallback and zero data tracking.

          #### 📦 Release Assets
          | Asset | Description | Direct Download |
          | :--- | :--- | :--- |
          | `NoorConnect-v2.2.1.apk` | Official Versioned Release APK | **[Download APK](https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/NoorConnect-v2.2.1.apk)** |
          | `noor-connect-nightly.apk` | Fast Direct In-App Auto-Update APK | **[Download APK](https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/noor-connect-nightly.apk)** |
          | `NoorConnect-v2.2.1.apk.sha256` | SHA-256 Integrity Verification | [View Checksum](https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/NoorConnect-v2.2.1.apk.sha256) |
          | `noor-connect-nightly.apk.sha256` | SHA-256 Integrity Verification | [View Checksum](https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/noor-connect-nightly.apk.sha256) |
          | `version.json` | Live In-App Update Manifest | [View Manifest](https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/version.json) |
          | `build-info.json` | Continuous Integration Build Info | [View Info](https://github.com/Ahmadnedariya786/Noor-connect/releases/download/nightly/build-info.json) |

          - **Version:** `2.2.1`
          - **Commit SHA:** `${{ github.sha }}` (`${{ steps.prep.outputs.sha_short }}`)
          - **Branch:** `${{ github.ref_name }}`
          - **Build Timestamp (UTC):** `${{ steps.prep.outputs.timestamp }}`
          - **APK Package Size:** `${{ steps.prep.outputs.size }}`

          #### 🌟 Highlights in v2.2.1
          - **Quran Mushaf Engine:** 15-line Madani & 7-line IndoPak Quran, interactive word-by-word Tajweed, Surah Ar-Rahman / Al-Kahf / Al-Mulk / Al-Waqi'ah layout alignments, and 47 authentic reciters.
          - **Ultra-Smart Zakat & Nisab Calculator:** Live gold (XAU) & silver (XAG) market rates across 24K, 22K, 21K, and 18K purity, 8 wealth categories, and 1-page A4 PDF export with native sharing.
          - **Audio & Tilawah Suite:** In-app audio caching, multi-language Tafsir (Urdu in Jameel Noori Nastaliq, English, Gujarati, Hindi, Arabic, Bengali, Turkish, Russian, French) with offline packs.
          - **6 Dual-Tone Royal Themes:** Oxford Gold, Imperial Violet, Burgundy Velvet, Desert Scroll, Royal Sapphire, and Makkah Silk.
          - **Security & Privacy:** Zero-user-impact stealth owner vault and 0 CodeQL security alerts.
          EOF

          RELEASE_TITLE="Noor Connect v2.2.1 — Latest Official APK (Build ${{ steps.prep.outputs.sha_short }})"

          if gh release view nightly >/dev/null 2>&1; then
            echo "Updating existing 'nightly' release metadata..."
            gh release edit nightly --title "$RELEASE_TITLE" --notes-file release-notes.md --target "${{ github.sha }}" --latest
          else
            echo "Creating new 'nightly' release..."
            gh release create nightly --title "$RELEASE_TITLE" --notes-file release-notes.md --target "${{ github.sha }}" --latest
          fi

          echo "Uploading release assets with --clobber..."
          gh release upload nightly \
            NoorConnect-v2.2.1.apk \
            NoorConnect-v2.2.1.apk.sha256 \
            noor-connect-nightly.apk \
            noor-connect-nightly.apk.sha256 \
            build-info.json \
            version.json \
            --clobber

          echo "✅ Nightly APK, checksums, and version manifest published successfully with --clobber!"
