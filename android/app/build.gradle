apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def keystorePropertiesFile = rootProject.file("local.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.noorconnect.app"
    compileSdk = rootProject.ext.compileSdkVersion
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    defaultConfig {
        applicationId "com.noorconnect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties.containsKey('RELEASE_STORE_FILE')) {
                storeFile file(keystoreProperties['RELEASE_STORE_FILE'])
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Task to move mushaf images from public to android assets and remove from dist to avoid duplication
task moveMushafImages {
    def sourceDir = file("${project.projectDir}/../../public/mushaf")
    def targetDir = file("${project.projectDir}/src/main/assets/public/mushaf")
    def distDir = file("${project.projectDir}/../../dist/mushaf")
    
    doLast {
        println "Source dir: ${sourceDir.absolutePath}, exists: ${sourceDir.exists()}"
        println "Target dir: ${targetDir.absolutePath}"
        println "Dist dir: ${distDir.absolutePath}, exists: ${distDir.exists()}"
        
        // Only run if source directory exists
        if (sourceDir.exists()) {
            // Create target directory if it doesn't exist
            targetDir.mkdirs()
            
            // Copy images from public/mushaf to android assets
            def copied = 0
            sourceDir.eachFile { file ->
                if (file.name.endsWith('.webp')) {
                    def targetFile = new File(targetDir, file.name)
                    targetFile.bytes = file.bytes
                    copied++
                }
            }
            println "Copied ${copied} images to ${targetDir.absolutePath}"
            
            // Remove images from dist/mushaf if it exists (to avoid duplication after Capacitor sync)
            if (distDir.exists()) {
                def deleted = 0
                distDir.eachFile { file ->
                    if (file.name.endsWith('.webp')) {
                        file.delete()
                        deleted++
                    }
                }
                println "Deleted ${deleted} images from ${distDir.absolutePath}"
                // Remove empty directory
                if (distDir.listFiles().length == 0) {
                    distDir.deleteDir()
                    println "Removed empty dist/mushaf directory"
                }
            }
            
            println "Moved mushaf images from public/mushaf to android assets and removed from dist/mushaf"
        } else {
            println "Source directory does not exist, skipping"
        }
    }
}

// Run the move task before preBuild
preBuild.dependsOn moveMushafImages

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
		dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // WorkManager for periodic widget refresh
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Coroutines for async widget operations
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Media for Radio Widget playback controls in notification
    implementation "androidx.media:media:1.7.0"
}

apply from: 'capacitor.build.gradle'

// Removed Google Services for F-Droid compliance. All notifications are handled locally.
apply from: 'fdroid.gradle'
